[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracked-tools"
version = "1.0.0"
description = "Analysis tools for Tracked<T> JSONL journals: stability reducer, line injector, boundary patcher, interop kit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
# libclang is only needed by tracked-line-inject
inject = ["libclang"]
# the anthropic SDK is only needed by tracked_tools.interop.llm's default
# transport (imported lazily; generate_with_retries accepts any callable)
llm = ["anthropic"]
test = ["pytest", "libclang"]

[project.scripts]
tracked-reduce = "tracked_tools.reduce.cli:main"
tracked-line-inject = "tracked_tools.inject:main"
tracked-boundary-patch = "tracked_tools.boundary:main"
tracked-view = "tracked_tools.view.cli:main"

[tool.setuptools.packages.find]
include = ["tracked_tools*"]

[tool.setuptools.package-data]
"tracked_tools.interop" = ["ruleset.txt"]
"tracked_tools.view" = ["template.html"]
