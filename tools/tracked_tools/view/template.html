<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracked run viewer</title>
<!--
  Single-file viewer for Tracked<T> journal runs (docs/TRACKED_LIBRARY_PLAN.md
  Phase 6; design record: viewer/README.md).  Zero dependencies: no npm, no
  CDN, no fetch, no external fonts — works from file://.

  The view model is injected by `tracked-view` into the JSON script block
  below (the first occurrence of the injection marker in this file — do not
  name it anywhere above the script block); opened standalone the template
  shows its empty state.

  Visual encoding (validated against the dataviz reference palette, both
  modes; see viewer/README.md for the validator runs):
    - signal class = categorical identity: local_cancellation blue slot 1,
      cancellation_cascade orange slot 2, log_near_root aqua slot 3;
      stable + atan2_saturation = neutral (saturation carries its cap badge).
      Chips + a fixed legend everywhere: identity is never color-alone.
    - status colors are reserved for state: range violation (critical),
      non-finite (serious) — always icon + label.
    - hotspot meter = digits lost from max_rel_err on an explicit 16-digit
      track (never cond — a cascade ranks #1 *because* cond is low).
    - rel_err decade histogram clamped to [1e-17, 1) with labeled overflow
      bins; sequential single hue.
    - drill-down op DAG: sequential ramp over log10(cond) of finite,
      uncapped conds; capped/non-finite nodes badge out of the ramp.
    - every chart has a table twin; tooltips never gate; all marks are
      keyboard-focusable.
  Journal-derived strings are untrusted: they enter the DOM only via
  textContent.
-->
<style>
  :root {
    color-scheme: light;
    /* chart chrome & ink (reference palette) */
    --surface: #fcfcfb; --page: #f9f9f7;
    --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    /* categorical class slots (validated all-pairs, light) */
    --class-local: #2a78d6;    /* slot 1 blue  : local_cancellation  */
    --class-cascade: #eb6834;  /* slot 2 orange: cancellation_cascade */
    --class-root: #1baf7a;     /* slot 3 aqua  : log_near_root        */
    --class-neutral: #898781;  /* stable / atan2_saturation           */
    /* status (reserved; icon+label always) */
    --status-critical: #d03b3b; --status-serious: #ec835a;
    --status-warning: #fab219;  --status-good: #0ca30c;
    /* sequential ramp anchors (blue) */
    --seq-lo: #cde2fb; --seq-hi: #0d366b;
    --bar: #2a78d6;
    --wash: rgba(11,11,11,0.035);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19; --page: #0d0d0d;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10);
    /* dark steps are separately selected, not flipped (validated all-pairs) */
    --class-local: #3987e5; --class-cascade: #d95926; --class-root: #199e70;
    --class-neutral: #898781;
    --seq-lo: #184f95; --seq-hi: #b7d3f6;
    --bar: #3987e5;
    --wash: rgba(255,255,255,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19; --page: #0d0d0d;
      --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
      --grid: #2c2c2a; --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --class-local: #3987e5; --class-cascade: #d95926; --class-root: #199e70;
      --class-neutral: #898781;
      --seq-lo: #184f95; --seq-hi: #b7d3f6;
      --bar: #3987e5;
      --wash: rgba(255,255,255,0.05);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; }

  header.app { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px 10px; border-bottom: 1px solid var(--grid); }
  header.app h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header.app .meta { color: var(--ink-3); font-size: 12px; }
  header.app .spacer { flex: 1; }
  .tabs { display: flex; gap: 4px; }
  .tabs button, .toggle button, button.linkish {
    font: inherit; color: var(--ink-2); background: none;
    border: 1px solid transparent; border-radius: 7px; padding: 5px 12px;
    cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 650;
    background: var(--surface); border-color: var(--border); }
  .tabs button:hover, .toggle button:hover, button.linkish:hover
    { background: var(--wash); }
  button.linkish { color: var(--ink); border-color: var(--border);
    background: var(--surface); font-size: 12px; }

  .filters { display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
  .filters select { font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 8px; }

  main { padding: 0 20px 40px; }
  .layout { display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 13px; font-weight: 650; margin: 0 0 8px;
    color: var(--ink-2); text-transform: none; }

  /* unit list */
  .unit-list { display: flex; flex-direction: column; gap: 6px; }
  .unit-list button { text-align: left; font: inherit; background: none;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
    cursor: pointer; color: var(--ink); background: var(--surface); }
  .unit-list button[aria-selected="true"] { outline: 2px solid var(--class-local);
    outline-offset: -1px; }
  .unit-list .uname { font-weight: 650; font-size: 13px; }
  .unit-list .usub { color: var(--ink-3); font-size: 11px; margin-top: 2px; }

  /* chips & badges: swatch carries color, text stays in ink tokens */
  .chip { display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--ink-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 8px 1px 5px; background: var(--surface);
    white-space: nowrap; }
  .chip .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .badge { display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; border-radius: 999px; padding: 1px 8px;
    border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
  .badge.critical { border-color: var(--status-critical); color: var(--ink); }
  .badge.critical .ic { color: var(--status-critical); }
  .badge.serious { border-color: var(--status-serious); color: var(--ink); }
  .badge.serious .ic { color: var(--status-serious); }
  .badge .ic { font-weight: 700; }

  .legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    font-size: 12px; color: var(--ink-2); margin: 2px 0 10px; }
  .legend .edge-key { display: inline-flex; align-items: center; gap: 5px; }
  .legend .edge-key svg { display: block; }

  /* graph */
  .graph-wrap { overflow: auto; border: 1px solid var(--grid);
    border-radius: 8px; background: var(--surface); }
  svg text { fill: var(--ink); }
  svg .sub { fill: var(--ink-3); }
  svg .lane-label { fill: var(--ink-2); font-size: 11px; font-weight: 650; }
  svg .lane-line { stroke: var(--grid); stroke-width: 1; }
  svg .edge { stroke: var(--axis); stroke-width: 2; fill: none; }
  svg .edge.chain { stroke: var(--class-cascade); }
  svg .node rect.box { fill: var(--surface); stroke: var(--border); rx: 6; }
  svg .node:hover rect.box, svg .node:focus rect.box
    { stroke: var(--ink-3); }
  svg .node { cursor: pointer; outline: none; }
  svg .node:focus-visible rect.box { stroke: var(--ink); stroke-width: 1.5; }
  svg .accent { rx: 2; }

  /* detail panel & tables */
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--grid);
    vertical-align: top; }
  th { color: var(--ink-3); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover td { background: var(--wash); }

  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px;
    font-size: 12px; }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }

  /* stat tiles */
  .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px; min-width: 110px; }
  .tile .label { font-size: 12px; color: var(--ink-3); }
  .tile .value { font-size: 24px; font-weight: 600; }

  /* hotspot cards */
  .cards { display: grid; gap: 10px; }
  .hotspot { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; }
  .hotspot .rank { font-size: 18px; font-weight: 650; color: var(--ink-3); }
  .hotspot .loc { font-weight: 650; }
  .hotspot .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-top: 4px; }
  .hotspot .note { color: var(--ink-2); font-size: 12px; margin-top: 4px; }
  .meter { margin-top: 8px; max-width: 420px; }
  .meter .track { height: 8px; border-radius: 4px; position: relative;
    overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
  .meter .cap-line { font-size: 11px; color: var(--ink-3); margin-top: 3px;
    display: flex; justify-content: space-between; }
  .metrics { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px;
    color: var(--ink-2); margin-top: 6px; }
  .metrics b { color: var(--ink); font-weight: 650;
    font-variant-numeric: tabular-nums; }

  .hist { margin-top: 8px; }

  /* tooltip */
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; max-width: 340px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
  #tip .t-title { font-weight: 650; margin-bottom: 3px; }
  #tip .t-row { display: flex; justify-content: space-between; gap: 14px; }
  #tip .t-row .v { font-weight: 650; font-variant-numeric: tabular-nums; }
  #tip .t-row .k { color: var(--ink-2); }

  .empty { text-align: center; color: var(--ink-3); padding: 80px 20px; }
  .section-gap { margin-top: 16px; }
  .scroll-x { overflow-x: auto; }
  .hidden { display: none !important; }
  .code-line { background: var(--wash); border-radius: 6px; padding: 6px 10px;
    margin-top: 6px; overflow-x: auto; white-space: nowrap; }
  footer { color: var(--ink-3); font-size: 11px; padding: 18px 20px;
    border-top: 1px solid var(--grid); }
</style>
</head>
<body>
<script type="application/json" id="vm">__TRACKED_VIEW_MODEL_JSON__</script>

<header class="app">
  <h1>Tracked run viewer</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="dag" aria-selected="true">DAG view</button>
    <button role="tab" data-tab="report" aria-selected="false">Report</button>
  </div>
  <div class="toggle"><button id="theme" title="Cycle theme">Theme: auto</button></div>
</header>

<div class="filters" id="filters"></div>

<main>
  <div id="empty" class="empty hidden">
    <p><b>No run loaded.</b></p>
    <p>Generate a view with <code>tracked-view &lt;run_dir&gt; -o view.html</code>.</p>
  </div>

  <section id="tab-dag" class="layout">
    <div>
      <div class="card"><h2>Units</h2><div class="unit-list" id="units"></div></div>
    </div>
    <div id="dag-main"></div>
  </section>

  <section id="tab-report" class="hidden"></section>
</main>

<footer id="foot"></footer>
<div id="tip" role="status"></div>

<script>
"use strict";
/* ============================ model & helpers ============================ */
let VM = null;
try {                              // standalone (marker un-replaced) -> empty state
  VM = JSON.parse(document.getElementById("vm").textContent);
} catch (e) { VM = null; }

const CLASS_COLOR = {
  local_cancellation:   "var(--class-local)",
  cancellation_cascade: "var(--class-cascade)",
  log_near_root:        "var(--class-root)",
  atan2_saturation:     "var(--class-neutral)",
  stable:               "var(--class-neutral)",
};
const CLASS_LABEL = {
  local_cancellation: "local cancellation",
  cancellation_cascade: "cancellation cascade",
  log_near_root: "elevated conditioning",
  atan2_saturation: "saturation cap only",
  stable: "stable",
};
// Compact keys for count chips; the legend pairs them with the full label so
// identity is never carried by color (or abbreviation) alone.
const CLASS_ABBREV = {
  local_cancellation: "LC",
  cancellation_cascade: "CC",
  log_near_root: "EC",
  atan2_saturation: "SAT",
  stable: "stable",
};
// Non-stable classes in severity order (worst first).
const CLASS_ORDER = ["local_cancellation", "cancellation_cascade",
                     "log_near_root", "atan2_saturation"];
const DIGITS_TRACK = 16;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;   // untrusted-safe
  return e;
}
function svgEl(tag, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  return e;
}
function basename(p) { const i = p.lastIndexOf("/"); return i < 0 ? p : p.slice(i + 1); }
function fmt(x) {                       // numbers or v1 sentinel strings
  if (x === null || x === undefined) return "–";
  if (typeof x === "string") return x;  // "nan" / "inf" / "-inf"
  if (x === 0) return "0";
  const a = Math.abs(x);
  if (a >= 1e4 || a < 1e-3) return x.toExponential(2);
  return String(Math.round(x * 10000) / 10000);
}
function fmtInt(x) { return x === null || x === undefined ? "–" : x.toLocaleString("en-US"); }
function isNum(x) { return typeof x === "number" && isFinite(x); }

/* sequential ramp (single hue) between the two CSS anchor colors */
function cssColor(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}
function hex2rgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function ramp(t) {                       // t in [0,1]
  const a = hex2rgb(cssColor("--seq-lo")), b = hex2rgb(cssColor("--seq-hi"));
  const m = a.map((v, i) => Math.round(v + (b[i] - v) * Math.max(0, Math.min(1, t))));
  return `rgb(${m[0]},${m[1]},${m[2]})`;
}
function inkFor(rgbStr) {                // in-fill text: white/ink by luminance
  const m = rgbStr.match(/\d+/g).map(Number);
  const lum = 0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2];
  return lum > 140 ? "#0b0b0b" : "#ffffff";
}

/* ============================ tooltip ============================ */
const tip = document.getElementById("tip");
function showTip(rows, x, y) {
  tip.textContent = "";
  for (const r of rows) {
    if (r.title) { tip.appendChild(el("div", "t-title", r.title)); continue; }
    const row = el("div", "t-row");
    row.appendChild(el("span", "k", r.k));
    row.appendChild(el("span", "v", r.v));
    tip.appendChild(row);
  }
  tip.style.display = "block";
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x + pad, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(y + pad, innerHeight - h - 8) + "px";
}
function hideTip() { tip.style.display = "none"; }
// the tip is position:fixed and anchored to a getBoundingClientRect() snapshot;
// any scroll (document or .graph-wrap) invalidates that anchor, so hide it
addEventListener("scroll", hideTip, { capture: true, passive: true });
function attachTip(node, rowsFn) {       // pointer + keyboard, same content
  node.addEventListener("pointermove", e => showTip(rowsFn(), e.clientX, e.clientY));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("focus", () => {
    const r = node.getBoundingClientRect();
    showTip(rowsFn(), r.right, r.top);
  });
  node.addEventListener("blur", hideTip);
}

/* ============================ shared components ============================ */
function classChip(cls) {
  const c = el("span", "chip");
  const sw = el("span", "sw");
  sw.style.background = CLASS_COLOR[cls] || "var(--class-neutral)";
  c.appendChild(sw);
  c.appendChild(document.createTextNode(CLASS_LABEL[cls] || cls));
  return c;
}
function classCountChip(cls, count) {     // compact: swatch + abbrev + ×count
  const c = el("span", "chip");
  const sw = el("span", "sw");
  sw.style.background = CLASS_COLOR[cls] || "var(--class-neutral)";
  c.appendChild(sw);
  c.appendChild(document.createTextNode(
    `${CLASS_ABBREV[cls] || cls} ×${count}`));
  // accessible name starts with the visible text (WCAG 2.5.3 label-in-name)
  c.title = `${CLASS_ABBREV[cls] || cls} ×${count}`
    + ` — ${CLASS_LABEL[cls] || cls}, ${count} region(s)`;
  c.setAttribute("aria-label", c.title);
  return c;
}
function badgeEl(kind, text) {           // status badges: icon + label, never color alone
  const b = el("span", "badge " + kind);
  const icons = { critical: "▲", serious: "✕", info: "◦" };
  b.appendChild(el("span", "ic", icons[kind] || "◦"));
  b.appendChild(document.createTextNode(text));
  return b;
}
function regionBadges(r) {
  const out = [];
  if (r.range_ok === false)
    out.push(badgeEl("critical", "range violation"));
  if (r.nonfinite_count > 0)
    out.push(badgeEl("serious", `non-finite ×${r.nonfinite_count}`));
  const caps = r.cap_counts || {};
  const capTotal = Object.values(caps).reduce((a, b) => a + b, 0);
  if (capTotal > 0)
    out.push(badgeEl("info", "cap " + Object.keys(caps).sort().map(k => `${k}×${caps[k]}`).join(" ")));
  else if (r.gate_a_count > 0)
    out.push(badgeEl("info", `cap ×${r.gate_a_count}`));
  if (r.exact_tie_count > 0)
    out.push(badgeEl("info", `exact ties ×${r.exact_tie_count}`));
  return out;
}
function classLegend(extra) {
  const lg = el("div", "legend");
  lg.appendChild(el("span", "", "Signal class:"));
  for (const cls of [...CLASS_ORDER, "stable"]) {
    const c = el("span", "chip");
    const sw = el("span", "sw");
    sw.style.background = CLASS_COLOR[cls] || "var(--class-neutral)";
    c.appendChild(sw);
    // pair the abbreviation with the full label so count chips are decodable
    const ab = CLASS_ABBREV[cls];
    c.appendChild(document.createTextNode(
      ab === CLASS_LABEL[cls] ? CLASS_LABEL[cls] : `${ab} · ${CLASS_LABEL[cls]}`));
    lg.appendChild(c);
  }
  for (const x of extra || []) lg.appendChild(x);
  return lg;
}
function edgeKey(color, label) {
  const k = el("span", "edge-key");
  const s = svgEl("svg", { width: 22, height: 8 });
  s.appendChild(svgEl("line", { x1: 1, y1: 4, x2: 21, y2: 4,
    stroke: color, "stroke-width": 2, "stroke-linecap": "round" }));
  k.appendChild(s);
  k.appendChild(el("span", "", label));
  return k;
}

/* rel_err decade histogram: domain clamped to [1e-17, 1) with labeled
   overflow bins; single-hue bars; counts in tooltip + the region table */
function histSVG(hist, zeroCount) {
  const LO = -17, HI = 0;                 // decades
  const bins = [];                        // {label, count}
  let under = 0, over = 0;
  const buckets = hist && hist.buckets ? hist.buckets : {};
  const byDecade = {};
  for (const k in buckets) {
    const d = parseInt(k, 10);
    if (d < LO) under += buckets[k];
    else if (d >= HI) over += buckets[k];
    else byDecade[d] = (byDecade[d] || 0) + buckets[k];
  }
  bins.push({ label: "<1e-17", count: under });
  for (let d = LO; d < HI; d++) bins.push({ label: "1e" + d, count: byDecade[d] || 0 });
  bins.push({ label: "≥1", count: over });

  const max = Math.max(1, ...bins.map(b => b.count));
  const bw = 12, gap = 2, plotH = 46, axisH = 14, w = bins.length * (bw + gap) + 6;
  const svg = svgEl("svg", { width: w, height: plotH + axisH, role: "img",
    "aria-label": "relative-error decade histogram" });
  bins.forEach((b, i) => {
    const h = b.count === 0 ? 0 : Math.max(2, Math.round(b.count / max * (plotH - 6)));
    const x = 3 + i * (bw + gap), y = plotH - h;
    const g = svgEl("g", { tabindex: 0 });
    const hit = svgEl("rect", { x: x - 1, y: 0, width: bw + 2, height: plotH,
      fill: "transparent" });
    const bar = svgEl("rect", { x, y, width: bw, height: h, rx: 2,
      fill: "var(--bar)" });
    g.appendChild(hit); g.appendChild(bar);
    attachTip(g, () => [{ title: "rel_err " + b.label },
                        { k: "records", v: fmtInt(b.count) }]);
    svg.appendChild(g);
  });
  svg.appendChild(svgEl("line", { x1: 0, y1: plotH + 0.5, x2: w, y2: plotH + 0.5,
    stroke: "var(--axis)", "stroke-width": 1 }));
  const mid = Math.round(bins.length / 2);
  for (const [i, t] of [[0, "<1e-17"], [mid, bins[mid].label],
                        [bins.length - 1, "≥1"]]) {
    const tx = svgEl("text", {
      x: i === 0 ? 3 : (i === bins.length - 1 ? w - 3 : 3 + i * (bw + gap) + bw / 2),
      y: plotH + 11,
      "text-anchor": i === 0 ? "start" : (i === bins.length - 1 ? "end" : "middle"),
      "font-size": 9, class: "sub" });
    tx.textContent = t;
    svg.appendChild(tx);
  }
  const wrap = el("div", "hist");
  wrap.appendChild(svg);
  if (zeroCount > 0)
    wrap.appendChild(el("div", "meta", `exact (rel_err = 0 / unbucketed): ${zeroCount}`));
  return wrap;
}

/* digits-lost meter: fill severity by digits, track = lighter step of the
   fill's own family; explicit 16-digit ceiling with overflow label */
function meterEl(digits, relErr) {
  const frac = Math.max(0, Math.min(1, digits / DIGITS_TRACK));
  let fill = "var(--class-local)", track = "rgba(42,120,214,0.18)";
  if (digits >= 10) { fill = "var(--status-critical)"; track = "rgba(208,59,59,0.18)"; }
  else if (digits >= 4) { fill = "var(--status-warning)"; track = "rgba(250,178,25,0.22)"; }
  const m = el("div", "meter");
  m.setAttribute("tabindex", "0");
  const tr = el("div", "track"); tr.style.background = track;
  const f = el("div", "fill"); f.style.width = (frac * 100).toFixed(1) + "%";
  f.style.background = fill;
  tr.appendChild(f); m.appendChild(tr);
  const cap = el("div", "cap-line");
  const lbl = digits >= DIGITS_TRACK
    ? "all ~16 digits lost (rel_err ≥ 1)"
    : `≈ ${digits.toFixed(1)} of ~16 digits lost`;
  cap.appendChild(el("span", "", lbl));
  cap.appendChild(el("span", "", "16"));
  m.appendChild(cap);
  attachTip(m, () => [{ title: "estimated digits lost" },
    { k: "digits", v: digits.toFixed(2) },
    { k: "max rel_err bound", v: fmt(relErr) }]);
  return m;
}

function metricsRow(m) {
  const row = el("div", "metrics");

  add("max rel_err", fmt(m.max_rel_err));
  if (m.p99_rel_err !== undefined && m.p99_rel_err !== null) add("p99", fmt(m.p99_rel_err));
  add("max cond", fmt(m.max_cond));

  if (m.n !== undefined) add("ops", fmtInt(m.n));
  if (m.samples !== undefined) add("samples", fmtInt(m.samples));
  return row;
}

function tableEl(headers, rows, numericCols) {

/* ============================ DAG view ============================ */
let currentUnit = null;
let dagMode = "graph";                    // "graph" | "tables"

function unitByName(name) { return VM.units.find(u => u.name === name); }

function renderUnitList() {
  const box = document.getElementById("units");
  box.textContent = "";
  for (const u of VM.units) {
    const b = el("button");
    b.setAttribute("aria-selected", String(u.name === currentUnit));
    const top = el("div", "uname", u.name || "(unscoped)");
    const sub = el("div", "usub",
      `${u.samples} samples · max rel_err ${fmt(u.max_rel_err)}`);
    // one count chip per non-stable class present (severity order); a unit
    // with no signal keeps the single "stable" chip
    const chipRow = el("div", "chips");
    let any = false;
    for (const cls of CLASS_ORDER) {
      const n = u.class_counts[cls];
      if (n) { chipRow.appendChild(classCountChip(cls, n)); any = true; }
    }
    if (!any) chipRow.appendChild(classChip("stable"));
    b.appendChild(top); b.appendChild(sub); b.appendChild(chipRow);
    b.addEventListener("click", () => { currentUnit = u.name; renderDag(); });
    box.appendChild(b);
  }
}

/* longest-path layering over the region dataflow graph; back edges (loops
   across iterations) are ignored for layout, still drawn */
function layerRegions(unit) {
  const keys = unit.regions.map(r => r.key);
  const idx = new Map(keys.map((k, i) => [k, i]));
  const out = keys.map(() => []);
  for (const e of unit.edges) {
    const a = idx.get(e.src), b = idx.get(e.dst);
    if (a !== undefined && b !== undefined) out[a].push(b);
  }
  const layer = new Array(keys.length).fill(0);
  const state = new Array(keys.length).fill(0);   // 0=un,1=stack,2=done
  const back = new Set();
  function dfs(v) {
    state[v] = 1;
    for (const w of out[v]) {
      if (state[w] === 1) { back.add(v + ">" + w); continue; }
      if (state[w] === 0) dfs(w);
      // v feeds w: w sits at least one layer right of v
    }
    state[v] = 2;
  }
  for (let v = 0; v < keys.length; v++) if (state[v] === 0) dfs(v);
  // longest path via repeated relaxation on the acyclic subset
  for (let pass = 0; pass < keys.length; pass++) {
    let changed = false;
    for (let v = 0; v < keys.length; v++)
      for (const w of out[v]) {
        if (back.has(v + ">" + w)) continue;
        if (layer[w] < layer[v] + 1) { layer[w] = layer[v] + 1; changed = true; }
      }
    if (!changed) break;
  }
  return { layer, idx, back };
}

function renderDag() {
  renderUnitList();
  const main = document.getElementById("dag-main");
  main.textContent = "";
  const u = unitByName(currentUnit);
  if (!u) return;

  const card = el("div", "card");
  const head = el("div");
  head.style.display = "flex"; head.style.alignItems = "center";
  head.style.gap = "10px"; head.style.flexWrap = "wrap";
  const h = el("h2", "", `${u.name || "(unscoped)"} — ${u.samples} samples, ${fmtInt(u.records)} ops`);
  h.style.flex = "1";
  head.appendChild(h);
  const toggle = el("div", "toggle");
  for (const m of ["graph", "tables"]) {
    const b = el("button", "", m === "graph" ? "Graph" : "Tables");
    if (m === dagMode) b.style.fontWeight = "700";
    b.addEventListener("click", () => { dagMode = m; renderDag(); });
    toggle.appendChild(b);
  }
  head.appendChild(toggle);
  card.appendChild(head);
  card.appendChild(classLegend([
    edgeKey("var(--axis)", "dataflow"),
    edgeKey(cssColor("--class-cascade"), "cascade chain"),
  ]));

  if (dagMode === "graph") card.appendChild(regionGraph(u));
  else {
    card.appendChild(el("h2", "", "Regions"));
    card.appendChild(regionsTable(u));
    card.appendChild(el("h2", "section-gap", "Dataflow edges"));
    card.appendChild(edgesTable(u));
    card.appendChild(el("h2", "section-gap", "Function-call rollup"));
    card.appendChild(fnRollupTable(u));
    if (Object.keys(u.variables).length) {
      card.appendChild(el("h2", "section-gap", "Named inputs"));
      card.appendChild(variablesTable(u));
    }
  }
  main.appendChild(card);

  const detail = el("div", "card section-gap");
  detail.id = "region-detail";
  detail.appendChild(el("h2", "", "Region detail"));
  main.appendChild(detail);

  if (u.drilldown) main.appendChild(drilldownCard(u));

  // default the detail panel to the unit's worst region
  const worst = u.regions.reduce((a, b) => b.max_rel_err > a.max_rel_err ? b : a,
    u.regions[0]);
  if (worst) renderRegionDetail(u, worst, { scroll: false });
}

function regionGraph(u) {
  const { layer, idx } = layerRegions(u);
  // lanes = functions, in canonical order
  const lanes = u.functions.map(f => f.key);
  const laneOf = new Map();
  for (const r of u.regions) laneOf.set(r.key, lanes.indexOf(r.function));

  const NW = 168, XGAP = 68, YGAP = 14, PADX = 170, PADY = 26;
  // node height: ordinal cue only (sqrt-clamped); exact n printed on the node
  const nMax = Math.max(...u.regions.map(r => r.n), 1);
  const hOf = r => Math.round(30 + 22 * Math.sqrt(r.n / nMax));

  // stack regions per (lane, layer)
  const cell = new Map();
  const pos = new Map();
  const laneHeights = new Array(lanes.length).fill(0);
  for (const r of u.regions) {
    const key = laneOf.get(r.key) + ":" + layer[idx.get(r.key)];
    const k = cell.get(key) || 0;
    cell.set(key, k + 1);
    pos.set(r.key, { stack: k });
  }
  // compute lane heights: max total stacked height over layers
  const stackH = new Map();
  for (const r of u.regions) {
    const li = laneOf.get(r.key), la = layer[idx.get(r.key)];
    const key = li + ":" + la;
    stackH.set(key, (stackH.get(key) || 0) + hOf(r) + YGAP);
  }
  for (const [key, hsum] of stackH) {
    const li = parseInt(key.split(":")[0], 10);
    laneHeights[li] = Math.max(laneHeights[li], hsum);
  }
  const laneY = [];
  let acc = PADY;
  for (let i = 0; i < lanes.length; i++) {
    laneY.push(acc);
    acc += Math.max(laneHeights[i], 44) + 22;
  }
  const maxLayer = Math.max(...u.regions.map(r => layer[idx.get(r.key)]), 0);
  const W = PADX + (maxLayer + 1) * (NW + XGAP) + 20;
  const H = acc + 6;

  const svg = svgEl("svg", { width: W, height: H, role: "img",
    "aria-label": "unit region dataflow graph" });

  // lane separators + labels
  lanes.forEach((fk, i) => {
    const y = laneY[i] - 12;
    if (i > 0) svg.appendChild(svgEl("line",
      { x1: 0, y1: y, x2: W, y2: y, class: "lane-line" }));
    const f = u.functions[i];
    const t = svgEl("text", { x: 8, y: laneY[i] + 4, class: "lane-label" });
    t.textContent = f.name + (f.file ? "  ·  " + basename(f.file) : "");
    svg.appendChild(t);
  });

  // place nodes
  const box = new Map();
  const cellSeen = new Map();
  for (const r of u.regions) {
    const li = laneOf.get(r.key), la = layer[idx.get(r.key)];
    const key = li + ":" + la;
    const k = cellSeen.get(key) || 0;
    cellSeen.set(key, k + 1);
    let yOff = 0;
    for (const rr of u.regions) {
      if (rr === r) break;
      if (laneOf.get(rr.key) === li && layer[idx.get(rr.key)] === la)
        yOff += hOf(rr) + YGAP;
    }
    const x = PADX + la * (NW + XGAP);
    const y = laneY[li] + yOff;
    box.set(r.key, { x, y, w: NW, h: hOf(r) });
  }

  // edges under nodes
  const edgeLayer = svgEl("g");
  svg.appendChild(edgeLayer);
  for (const e of u.edges) {
    const a = box.get(e.src), b = box.get(e.dst);
    if (!a || !b) continue;
    const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
    const dx = Math.max(24, (x2 - x1) / 2);
    const p = svgEl("path", { class: "edge", tabindex: 0,
      d: `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}` });
    attachTip(p, () => [{ title: "dataflow edge" },
      { k: "from", v: shortRegion(e.src) }, { k: "to", v: shortRegion(e.dst) },
      { k: "operand uses", v: fmtInt(e.n) }]);
    edgeLayer.appendChild(p);
  }
  // cascade chain spans as chain edges linking consecutive spans
  for (const c of u.chains) {
    const keys = chainSpanRegionKeys(u, c);
    for (let i = 0; i + 1 < keys.length; i++) {
      const a = box.get(keys[i]), b = box.get(keys[i + 1]);
      if (!a || !b) continue;
      const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y + b.h;
      const p = svgEl("path", { class: "edge chain", tabindex: 0,
        d: `M ${x1} ${y1} C ${x1} ${y1 + 26}, ${x2} ${y2 + 26}, ${x2} ${y2}` });
      attachTip(p, () => [{ title: "cascade chain" },
        { k: "spans", v: c.spans.map(s => basename(s.file) + ":" + s.line_start).join(" · ") },
        { k: "samples", v: fmtInt(c.count) },
        { k: "max rel_err", v: fmt(c.max_rel_err) }]);
      edgeLayer.appendChild(p);
    }
  }

  // nodes
  for (const r of u.regions) {
    const b = box.get(r.key);
    const g = svgEl("g", { class: "node", tabindex: 0, role: "button",
      transform: `translate(${b.x},${b.y})`,
      "aria-label": "region " + r.key });
    g.appendChild(svgEl("rect", { class: "box", width: b.w, height: b.h }));
    g.appendChild(svgEl("rect", { class: "accent", x: 3, y: 3, width: 4,
      height: b.h - 6, fill: CLASS_COLOR[r.signal_class] }));
    const t1 = svgEl("text", { x: 13, y: 16, "font-size": 11, "font-weight": 650 });
    t1.textContent = shortRegion(r.key);
    g.appendChild(t1);
    const t2 = svgEl("text", { x: 13, y: b.h - 7, "font-size": 10, class: "sub" });
    const capN = r.cap_counts
      ? Object.values(r.cap_counts).reduce((a, x) => a + x, 0) : r.gate_a_count;
    t2.textContent = `n=${r.n}` + (r.range_ok === false ? "  ▲range" : "")
      + (capN ? `  cap×${capN}` : "") + (r.exact_tie_count ? "  =tie" : "");
    g.appendChild(t2);
    attachTip(g, () => [{ title: shortRegion(r.key) },
      { k: "class", v: CLASS_LABEL[r.signal_class] },
      { k: "ops", v: fmtInt(r.n) },
      { k: "max rel_err", v: fmt(r.max_rel_err) },
      { k: "max cond", v: fmt(r.max_cond) },
      { k: "function", v: r.function === "(unattributed)" ? r.function
          : r.function.split(":").pop() }]);
    const open = () => renderRegionDetail(u, r);
    g.addEventListener("click", open);
    g.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); }
    });
    svg.appendChild(g);
  }

  const wrap = el("div", "graph-wrap");
  wrap.appendChild(svg);
  return wrap;
}

function shortLeaf(s) {                   // "_lit@dir/file.hpp:12~0" -> "_lit@file.hpp:12~0"
  const at = s.indexOf("@");
  if (at < 0) return s;
  return s.slice(0, at + 1) + basename(s.slice(at + 1));
}
function shortRegion(key) {
  if (!key) return "(unattributed)";
  const parts = key.split(":");
  if (parts.length >= 3) {
    return basename(parts.slice(0, -2).join(":")) + ":" + parts[parts.length - 1];
  }
  return basename(parts.slice(0, -1).join(":")) + ":" + parts[parts.length - 1];
}
function chainSpanRegionKeys(u, c) {
  // map chain spans back to region keys via file:line reconstruction
  const keys = [];
  for (const s of c.spans) {
    const want = s.file + ":" + s.line_start;
    const hit = u.regions.find(r => r.key === want
      || r.key === s.file + ":" + s.line_start);
    if (hit) keys.push(hit.key);
  }
  return keys;
}

function renderRegionDetail(u, r, opts) {
  const d = document.getElementById("region-detail");
  d.textContent = "";
  d.appendChild(el("h2", "", "Region detail"));
  const title = el("div");
  const strong = el("b", "", r.key || "(unattributed ops)");
  title.appendChild(strong);
  d.appendChild(title);
  const row = el("div", "hotspot-row");
  row.style.display = "flex"; row.style.gap = "8px"; row.style.flexWrap = "wrap";
  row.style.margin = "6px 0";
  row.appendChild(classChip(r.signal_class));
  if (r.rung) {                      // AMP-adapter extension slot (viewer/README.md)
    const rung = el("span", "chip");
    rung.appendChild(el("b", "", "rung "));
    rung.appendChild(document.createTextNode(String(r.rung)));
    row.appendChild(rung);
  }
  for (const b of regionBadges(r)) row.appendChild(b);
  d.appendChild(row);
  d.appendChild(el("div", "meta", r.note));

  const kv = el("dl", "kv section-gap");
  const pairs = [
    ["kind", r.kind || "(operator ops)"],
    ["function", r.function],
    ["ops (n)", fmtInt(r.n)],
    ["op mix", Object.keys(r.ops).sort().map(k => `${k}×${r.ops[k]}`).join("  ")],
    ["max cond", fmt(r.max_cond)],
    ["numeric 1/u gate count", fmtInt(r.gate_a_count)],
    ["max rel_err", fmt(r.max_rel_err)],
    ["p50 / p99 rel_err", fmt(r.p50_rel_err) + "  /  " + fmt(r.p99_rel_err)],
    ["max amplification", fmt(r.max_amp)],
    ["sensitivity (cond×amp)", fmt(r.max_sensitivity)],
    ["|val| range", fmt(r.abs_val_min) + " … " + fmt(r.abs_val_max)],
    ["value-range guard", r.range_ok ? "ok" : "VIOLATED"],
    ["region-local inputs", r.region_local_vars.join(", ") || "–"],
  ];
  for (const f in r.predictions)
    pairs.push([`predicted rel_err if ${f}`, fmt(r.predictions[f])]);
  for (const [k, v] of pairs) {
    kv.appendChild(el("dt", "", k));
    kv.appendChild(el("dd", "", v));
  }
  d.appendChild(kv);
  d.appendChild(el("h2", "section-gap", "rel_err distribution (decades)"));
  d.appendChild(histSVG(r.rel_err_hist, r.zero_rel_err));
  const bt = Object.keys(r.rel_err_hist.buckets || {})
    .map(k => [parseInt(k, 10), r.rel_err_hist.buckets[k]])
    .sort((a, b) => a[0] - b[0]);
  if (bt.length)
    d.appendChild(tableEl(["decade", "records"],
      bt.map(([dk, c]) => ["1e" + dk, fmtInt(c)]), [1]));
  if (!opts || opts.scroll !== false)
    d.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

/* -------- tables (the chart twins) -------- */
function regionsTable(u) {
  return tableEl(
    ["region", "kind", "function", "class", "n", "max cond", "max rel_err",
     "p99", "sens", "range", "caps", "ties", "non-finite"],
    u.regions.map(r => [
      r.key || "(unattributed)", r.kind || "–",
      r.function === "(unattributed)" ? r.function : r.function.split(":").pop(),
      CLASS_LABEL[r.signal_class],
      fmtInt(r.n), fmt(r.max_cond), fmt(r.max_rel_err), fmt(r.p99_rel_err),
      fmt(r.max_sensitivity), r.range_ok ? "ok" : "VIOLATED",
      r.cap_counts === null ? "n/a"
        : Object.keys(r.cap_counts).sort().map(k => `${k}×${r.cap_counts[k]}`).join(" ") || "0",
      r.exact_tie_count === null ? "n/a" : fmtInt(r.exact_tie_count),
      r.nonfinite_count === null ? "n/a" : fmtInt(r.nonfinite_count),
    ]), [4, 5, 6, 7, 8, 11, 12]);
}
function edgesTable(u) {
  if (!u.edges.length) return el("div", "meta", "no cross-region dataflow");
  return tableEl(["from", "to", "operand uses"],
    u.edges.map(e => [shortRegion(e.src), shortRegion(e.dst), fmtInt(e.n)]), [2]);
}
function fnRollupTable(u) {
  const fnOf = new Map(u.regions.map(r => [r.key, r.function]));
  const roll = new Map();
  for (const e of u.edges) {
    const a = fnOf.get(e.src), b = fnOf.get(e.dst);
    if (a === undefined || b === undefined || a === b) continue;
    // JSON key: collision-free for any (a, b), incl. paths with spaces
    const k = JSON.stringify([a, b]);
    roll.set(k, (roll.get(k) || 0) + e.n);
  }
  if (!roll.size) return el("div", "meta", "no cross-function dataflow");
  const rows = [...roll.entries()].sort()
    .map(([k, n]) => {
      const [a, b] = JSON.parse(k);
      const nm = x => x === "(unattributed)" ? x : x.split(":").pop();
      return [nm(a), nm(b), fmtInt(n)];
    });
  return tableEl(["caller / producer", "consumer", "operand uses"], rows, [2]);
}
function variablesTable(u) {
  const names = Object.keys(u.variables).sort();
  return tableEl(
    ["input", "kind", "sensitivity", "samples", "predicted rel_err (targets)"],
    names.map(n => {
      const v = u.variables[n];
      const preds = Object.keys(v.predictions)
        .map(f => `${f}: ${fmt(v.predictions[f])}`).join("  ");
      return [n, v.is_source_var ? "source" : "constant",
              fmt(v.max_sensitivity), fmtInt(v.n_samples), preds];
    }), [2, 3]);
}

/* -------- drill-down -------- */
function drilldownCard(u) {
  const dd = u.drilldown;
  const card = el("div", "card section-gap");
  const h = el("h2", "", `Per-sample op-level DAG — sample ${dd.sample ?? "?"} `
    + `(argmax rel_err ${fmt(dd.max_rel_err)})`);
  card.appendChild(h);
  if (dd.rerun) {
    const line = el("div", "code-line mono",
      "gen driver rerun (bit-identical slice): " + dd.rerun);
    card.appendChild(line);
  }
  const legend = el("div", "legend");
  legend.appendChild(el("span", "", "node fill = log10(cond), finite & uncapped:"));
  const bar = svgEl("svg", { width: 90, height: 10 });
  for (let i = 0; i < 9; i++)
    bar.appendChild(svgEl("rect", { x: i * 10, y: 0, width: 10, height: 10,
      fill: ramp(i / 8) }));
  const lw = el("span", "edge-key"); lw.appendChild(bar);
  legend.appendChild(lw);
  legend.appendChild(el("span", "", "low → high"));
  legend.appendChild(badgeEl("info", "cap = saturated (outside ramp)"));
  legend.appendChild(badgeEl("serious", "non-finite value"));
  card.appendChild(legend);
  card.appendChild(opDagSVG(u, dd));
  card.appendChild(el("h2", "section-gap", "Ops table"));
  card.appendChild(opsTable(dd));
  return card;
}

function opDagSVG(u, dd) {
  const nodes = dd.nodes;
  // layering: longest path from leaves via "in" indices
  const layer = nodes.map(() => 0);
  nodes.forEach((n, i) => {
    for (const o of n.in) if (typeof o === "number")
      layer[i] = Math.max(layer[i], layer[o] + 1);
  });
  // sources occupy layer -1 conceptually; draw them at x of layer 0 - 1
  const perLayer = new Map();
  const yIndex = nodes.map(() => 0);
  nodes.forEach((n, i) => {
    const k = perLayer.get(layer[i]) || 0;
    yIndex[i] = k;
    perLayer.set(layer[i], k + 1);
  });
  const srcIndex = new Map();
  dd.sources.forEach((s, i) => srcIndex.set(s, i));

  // ramp domain: finite, uncapped conds
  let lo = Infinity, hi = -Infinity;
  for (const n of nodes) {
    if (n.cap || !isNum(n.cond) || n.cond <= 0) continue;
    const l = Math.log10(n.cond);
    lo = Math.min(lo, l); hi = Math.max(hi, l);
  }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (hi - lo < 1e-9) hi = lo + 1;

  const NX = 96, NY = 46, R = 11, PAD = 30, SRCX = 210;
  const maxLayer = Math.max(...layer, 0);
  const rows = Math.max(...[...perLayer.values()], dd.sources.length, 1);
  const W = PAD + SRCX + (maxLayer + 1) * NX + 60;
  const H = Math.max(rows * NY + 50, dd.sources.length * 34 + 50);
  const svg = svgEl("svg", { width: W, height: H, role: "img",
    "aria-label": "per-sample op DAG" });

  const posOf = i => ({ x: PAD + SRCX + layer[i] * NX,
                        y: 30 + yIndex[i] * NY });
  const srcPos = s => ({ x: 22, y: 30 + (srcIndex.get(s) || 0) * 34 });

  const edges = svgEl("g");
  svg.appendChild(edges);
  nodes.forEach((n, i) => {
    const p = posOf(i);
    for (const o of n.in) {
      const q = typeof o === "number" ? posOf(o) : srcPos(o);
      const path = svgEl("path", { class: "edge",
        "stroke-width": 1.2, opacity: 0.55,
        d: `M ${q.x + R} ${q.y} C ${q.x + 34} ${q.y}, ${p.x - 34} ${p.y}, ${p.x - R} ${p.y}` });
      edges.appendChild(path);
    }
  });

  // source leaves: squares, muted; direct-labeled (they are few)
  for (const s of dd.sources) {
    const p = srcPos(s);
    const g = svgEl("g", { tabindex: 0, class: "node" });
    g.appendChild(svgEl("rect", { x: p.x - 8, y: p.y - 8, width: 16, height: 16,
      rx: 3, fill: "var(--wash)", stroke: "var(--axis)" }));
    const t = svgEl("text", { x: p.x + 12, y: p.y + 4, "font-size": 10, class: "sub" });
    const short = shortLeaf(s);
    t.textContent = short.length > 26 ? "…" + short.slice(-24) : short;
    g.appendChild(t);
    attachTip(g, () => [{ title: "input leaf" }, { k: "id", v: s }]);
    svg.appendChild(g);
  }

  nodes.forEach((n, i) => {
    const p = posOf(i);
    const g = svgEl("g", { class: "node", tabindex: 0,
      "aria-label": `op ${n.op}` });
    // 24px+ hit target around an 22px node
    g.appendChild(svgEl("circle", { cx: p.x, cy: p.y, r: 16, fill: "transparent" }));
    let fill, badge = null;
    if (n.cap) { fill = "var(--wash)"; badge = "cap"; }
    else if (!isNum(n.cond)) { fill = "var(--wash)"; badge = "nf"; }
    else {
      const t = (Math.log10(Math.max(n.cond, 1e-30)) - lo) / (hi - lo);
      fill = ramp(t);
    }
    const c = svgEl("circle", { cx: p.x, cy: p.y, r: R, fill,
      stroke: "var(--surface)", "stroke-width": 2 });
    g.appendChild(c);
    if (badge) {
      const t = svgEl("text", { x: p.x, y: p.y + 3, "text-anchor": "middle",
        "font-size": 8, "font-weight": 700 });
      t.textContent = badge === "cap" ? "◦" : "✕";
      g.appendChild(t);
    }
    const isSink = !nodes.some(m => m.in.includes(i));
    const nonfinite = typeof n.val === "string";
    if (isSink || n.cap || n.exact_tie || nonfinite) {   // selective direct labels
      const t = svgEl("text", { x: p.x, y: p.y - R - 4, "text-anchor": "middle",
        "font-size": 9, class: "sub" });
      t.textContent = n.op + (n.exact_tie ? " =tie" : "") + (n.cap ? " cap:" + n.cap : "");
      g.appendChild(t);
    }
    attachTip(g, () => [{ title: `${n.op} @ ${shortRegion(n.region)}` },
      { k: "val", v: fmt(n.val) },
      { k: "cond", v: fmt(n.cond) },
      { k: "rel_err", v: fmt(n.rel_err) },
      ...(n.cap ? [{ k: "cap", v: n.cap }] : []),
      ...(n.exact_tie ? [{ k: "exact tie", v: "yes" }] : []),
      ...(n.label ? [{ k: "opaque fn", v: n.label }] : [])]);
    svg.appendChild(g);
  });

  const wrap = el("div", "graph-wrap");
  wrap.appendChild(svg);
  return wrap;
}

function opsTable(dd) {
  return tableEl(
    ["#", "op", "region", "inputs", "val", "cond", "rel_err", "flags"],
    dd.nodes.map((n, i) => [
      String(i), n.op + (n.label ? ` (${n.label})` : ""), shortRegion(n.region),
      n.in.map(o => typeof o === "number" ? "#" + o : shortLeaf(o)).join(", "),
      fmt(n.val), fmt(n.cond), fmt(n.rel_err),
      [n.cap ? "cap:" + n.cap : "", n.exact_tie ? "exact_tie" : ""]
        .filter(Boolean).join(" "),
    ]), [0, 4, 5, 6]);
}

/* ============================ report view ============================ */
let reportUnit = "*";

function renderReport() {
  const root = document.getElementById("tab-report");
  root.textContent = "";

  const kpis = el("div", "kpis");
  const tile = (label, value) => {
    const t = el("div", "tile");
    t.appendChild(el("div", "label", label));
    t.appendChild(el("div", "value", value));
    return t;
  };
  kpis.appendChild(tile("units", fmtInt(VM.totals.units)));
  kpis.appendChild(tile("samples", fmtInt(VM.totals.samples)));
  kpis.appendChild(tile("ops journaled", fmtInt(VM.totals.records)));
  kpis.appendChild(tile("hotspots", fmtInt(VM.report.hotspots_total)));
  kpis.appendChild(tile("non-finite records",
    VM.totals.nonfinite_records === null ? "n/a" : fmtInt(VM.totals.nonfinite_records)));
  root.appendChild(kpis);

  const filt = u => reportUnit === "*" || u === reportUnit;

  const hsCard = el("div", "card");
  const shown = VM.report.hotspots.filter(h => filt(h.unit));
  hsCard.appendChild(el("h2", "",
    `Ranked hotspots — showing ${shown.length} of ${VM.report.hotspots_total}`
    + (VM.report.hotspots_total > VM.report.hotspots.length
       ? ` (top ${VM.report.hotspots.length} distilled)` : "")));
  hsCard.appendChild(classLegend());
  const cards = el("div", "cards");
  for (const h of shown) {
    const c = el("div", "card hotspot");
    c.appendChild(el("div", "rank", "#" + h.rank));
    const body = el("div");
    const loc = el("div", "loc");
    loc.appendChild(el("span", "mono", shortLoc(h.location)));
    loc.appendChild(document.createTextNode("  ·  " + (h.unit || "(unscoped)")
      + (h.kind === "chain" ? "  ·  chain" : "")));
    body.appendChild(loc);
    const row = el("div", "row");
    row.appendChild(classChip(h.signal_class));
    if (h.metrics.range_ok === false)
      row.appendChild(badgeEl("critical", "range violation"));
    body.appendChild(row);
    body.appendChild(el("div", "note", h.note));
    body.appendChild(meterEl(h.metrics.digits_lost, h.metrics.max_rel_err));
    body.appendChild(metricsRow(h.metrics));
    const region = findRegion(h);
    if (region) {
      body.appendChild(histSVG(region.rel_err_hist, region.zero_rel_err));
    }
    c.appendChild(body);
    cards.appendChild(c);
  }
  if (!shown.length) cards.appendChild(el("div", "meta", "no hotspots for this filter"));
  hsCard.appendChild(cards);
  root.appendChild(hsCard);

  const ledCard = el("div", "card section-gap");
  const rows = VM.report.ledger.filter(r => r.unit === "*" || filt(r.unit));
  ledCard.appendChild(el("h2", "", `Decision ledger — ${rows.length} rows`));
  ledCard.appendChild(tableEl(
    ["unit", "subject", "kind", "verdict", "detail", "range", "caps", "ties"],
    rows.map(r => [
      r.unit === "*" ? "— run —" : (r.unit || "(unscoped)"),
      r.subject, r.kind || "run", r.verdict, r.detail || "",
      r.range || "", r.caps === null ? "n/a"
        : r.caps === undefined ? ""
        : Object.keys(r.caps).sort().map(k => `${k}×${r.caps[k]}`).join(" ") || "0",
      r.exact_ties === null ? "n/a"
        : r.exact_ties === undefined ? "" : String(r.exact_ties),
    ]), [7]));
  root.appendChild(ledCard);
}
function shortLoc(loc) {
  return loc.split(";").map(s => shortRegion(s.trim())).join("; ");
}
function findRegion(h) {
  if (h.kind !== "region") return null;
  const u = unitByName(h.unit);
  if (!u) return null;
  return u.regions.find(r => r.key === h.location) || null;
}

/* ============================ chrome ============================ */
function renderFilters(tab) {
  const f = document.getElementById("filters");
  f.textContent = "";
  if (!VM || tab !== "report") return;
  f.appendChild(el("span", "", "Unit:"));
  const sel = document.createElement("select");
  const optAll = document.createElement("option");
  optAll.value = "*"; optAll.textContent = "all units";
  sel.appendChild(optAll);
  for (const u of VM.units) {
    const o = document.createElement("option");
    o.value = u.name; o.textContent = u.name || "(unscoped)";
    sel.appendChild(o);
  }
  sel.value = reportUnit;
  sel.addEventListener("change", () => { reportUnit = sel.value; renderReport(); });
  f.appendChild(sel);
  f.appendChild(el("span", "", "— scopes every card and table below"));
}

let currentTab = "dag";
function switchTab(tab) {
  currentTab = tab;
  for (const b of document.querySelectorAll("#tabs button"))
    b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  document.getElementById("tab-dag").classList.toggle("hidden", tab !== "dag");
  document.getElementById("tab-report").classList.toggle("hidden", tab !== "report");
  renderFilters(tab);
  if (tab === "report") renderReport(); else renderDag();
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) switchTab(b.dataset.tab);
});

const themeBtn = document.getElementById("theme");
const THEMES = ["auto", "light", "dark"];
let themeIdx = 0;
themeBtn.addEventListener("click", () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  const t = THEMES[themeIdx];
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = "Theme: " + t;
  // re-render: ramp colors are computed from CSS custom properties
  if (VM) switchTab(currentTab);
});

/* ============================ boot ============================ */
if (!VM || !VM.units || VM.units.length === 0) {
  document.getElementById("empty").classList.remove("hidden");
  document.getElementById("tab-dag").classList.add("hidden");
  document.getElementById("tab-report").classList.add("hidden");
  if (VM) document.getElementById("meta").textContent =
    "empty run — " + (VM.provenance.journals || []).join(", ");
} else {
  const meta = document.getElementById("meta");
  meta.textContent = (VM.provenance.journals || []).join(", ")
    + (VM.library_versions.length ? "  ·  library " + VM.library_versions.join(", ") : "")
    + (VM.legacy ? "  ·  legacy (pre-v1) read" : "");
  const foot = document.getElementById("foot");
  const cfg = VM.config;
  foot.textContent = "Thresholds: local cancellation cond ≥ " + fmt(cfg.local_cancel_cond)
    + " · elevated cond ≥ " + fmt(cfg.high_cond)
    + " · cascade rel_err ≥ " + fmt(cfg.cascade_rel_err)
    + " (per-op cond < " + fmt(cfg.cascade_cond_ceiling) + ")"
    + " · saturation cap " + fmt(cfg.saturation_cap)
    + " · range guard: " + cfg.range_name
    + " — classes are mechanistic measurements (tracked-reduce), not remediation advice; "
    + "“stable” means no elevated mechanism detected, not downcast-safe.";
  currentUnit = VM.units.reduce((a, b) => b.max_rel_err > a.max_rel_err ? b : a,
    VM.units[0]).name;
  // deep links: #report / #tables / #light / #dark / #unit=<name> (comma-separable)
  const hash = location.hash.slice(1).split(",");
  if (hash.includes("tables")) dagMode = "tables";
  for (const part of hash) {
    if (part.startsWith("unit=") && unitByName(decodeURIComponent(part.slice(5))))
      currentUnit = decodeURIComponent(part.slice(5));
  }
  for (const t of ["light", "dark"]) {
    if (hash.includes(t)) {
      document.documentElement.setAttribute("data-theme", t);
      themeIdx = THEMES.indexOf(t);
      themeBtn.textContent = "Theme: " + t;
    }
  }
  switchTab(hash.includes("report") ? "report" : "dag");
}
